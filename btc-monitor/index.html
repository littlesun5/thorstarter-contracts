<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC价差监控器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .price-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .price-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .exchange-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }
        
        .price {
            font-size: 2.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .update-time {
            font-size: 0.9em;
            color: #777;
        }
        
        .spread-info {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .spread-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
        }
        
        .spread-value {
            font-size: 3em;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .spread-value.normal {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #2c5f2d;
        }
        
        .spread-value.warning {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #8b0000;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .spread-percentage {
            text-align: center;
            font-size: 1.2em;
            color: #666;
            margin-top: 10px;
        }
        
        .controls {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .control-item {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }
        
        input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
        }
        
        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
        }
        
        .status.running {
            color: #28a745;
        }
        
        .status.stopped {
            color: #dc3545;
        }
        
        .alert-history {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .alert-history h3 {
            margin-bottom: 15px;
            color: #555;
        }
        
        .alert-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .alert-time {
            font-weight: bold;
            color: #667eea;
        }
        
        .alert-message {
            color: #666;
            margin-top: 5px;
        }
        
        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            height: 400px;
        }
        
        .error-message {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #c00;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>🚀 BTC 价差监控器</h1>
        
        <div class="price-display">
            <div class="price-card">
                <div class="exchange-name">📦 Backpack Exchange</div>
                <div class="price" id="backpack-price">--</div>
                <div class="update-time" id="backpack-time">等待更新...</div>
            </div>
            <div class="price-card">
                <div class="exchange-name">⚡ Lighter</div>
                <div class="price" id="lighter-price">--</div>
                <div class="update-time" id="lighter-time">等待更新...</div>
            </div>
        </div>
        
        <div class="spread-info">
            <div class="spread-title">当前价差 (Backpack - Lighter)</div>
            <div class="spread-value normal" id="spread-value">--</div>
            <div class="spread-percentage" id="spread-percentage">--</div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <div class="control-item">
                    <label for="min-spread">最小价差报警阈值 (USD)</label>
                    <input type="number" id="min-spread" value="10" min="0">
                </div>
                <div class="control-item">
                    <label for="max-spread">最大价差报警阈值 (USD)</label>
                    <input type="number" id="max-spread" value="80" min="0">
                </div>
                <div class="control-item">
                    <label for="refresh-interval">刷新间隔 (秒)</label>
                    <input type="number" id="refresh-interval" value="5" min="1" max="60">
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn-start" onclick="startMonitoring()">▶ 开始监控</button>
                <button class="btn-stop" onclick="stopMonitoring()">⏹ 停止监控</button>
            </div>
            
            <div class="status stopped" id="status">⏸ 监控已停止</div>
        </div>
        
        <div class="chart-container">
            <canvas id="spreadChart"></canvas>
        </div>
        
        <div class="alert-history">
            <h3>📢 报警历史</h3>
            <div id="alert-list">
                <div style="color: #999;">暂无报警记录</div>
            </div>
        </div>
    </div>
    
    <script src="monitor.js"></script>
</body>
</html>
